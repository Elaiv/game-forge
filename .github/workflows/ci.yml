name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forge-game/requirements.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes -r forge-game/requirements.lock
          python -m pip install --no-deps -e forge-game

      - name: Run tests
        run: python -m unittest discover -s forge-game/scripts/tests -v

      - name: Run package checks
        run: |
          forge-game/scripts/forge-game-control doctor
          forge-game/scripts/forge-game-control validate-package
